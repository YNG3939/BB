name: お知らせを同期して公開

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - config.json
      - sync_sheet.py
      - .github/workflows/sync.yml

# GitHub-hosted runners are moving JavaScript actions from Node.js 20 to 24.
# Some official Pages actions still declare Node.js 20 internally, so opt in
# explicitly to the supported Node.js 24 compatibility mode and avoid warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Google Sheetsからお知らせを同期
        id: sync
        run: python sync_sheet.py
      - name: GitHub Pagesを準備
        if: steps.sync.outputs.skipped != 'true'
        uses: actions/configure-pages@v5
      - name: 公開ファイルをまとめる
        if: steps.sync.outputs.skipped != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: アーティファクトが見えるまで待つ
        if: steps.sync.outputs.skipped != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const maxAttempts = 18;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (data.artifacts.some((artifact) => artifact.name === 'github-pages')) {
                core.info(`Found github-pages artifact (attempt ${attempt}/${maxAttempts}).`);
                return;
              }
              core.info(`github-pages artifact not visible yet (attempt ${attempt}/${maxAttempts}); waiting 10s...`);
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            throw new Error('github-pages artifact did not appear within 3 minutes.');
      - name: 公開
        if: steps.sync.outputs.skipped != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 公開（再試行）
        if: failure() && steps.sync.outputs.skipped != 'true'
        id: deployment_retry
        uses: actions/deploy-pages@v4
